version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    ignore:
      - dependency-name: "actions/ai-inference"
        update-types: ["version-update:semver-major"]
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
